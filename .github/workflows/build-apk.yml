name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | sort | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" \
            || "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37" "build-tools;37.0.0" \
            || true
          ls /usr/local/lib/android/sdk/platforms || true
          ls /usr/local/lib/android/sdk/build-tools || true

      - name: Restore signing keystore
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          mkdir -p ~/.android
          base64 -d signing/debug.keystore.enc | openssl enc -d -aes-256-cbc -pbkdf2 -out ~/.android/debug.keystore -pass env:KEYSTORE_PASS
          ls -la ~/.android/debug.keystore

      - name: Build release APK (unsigned)
        working-directory: frontend
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK with fixed keystore
        run: |
          BT="$(ls -d /usr/local/lib/android/sdk/build-tools/*/ | sort -V | tail -1)"
          echo "build-tools: $BT"
          UNSIGNED="$(ls frontend/app/build/outputs/apk/release/*-unsigned.apk | head -1)"
          echo "unsigned: $UNSIGNED"
          "${BT}zipalign" -p 4 "$UNSIGNED" /tmp/aligned.apk
          "${BT}apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out app-release.apk /tmp/aligned.apk
          "${BT}apksigner" verify --print-certs app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mibo-release-apk
          path: app-release.apk
          retention-days: 7

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' frontend/app/build.gradle.kts | head -1)
          awk -v v="v$VERSION" '/^## / { if (f) exit; if ($2 == v) f=1 } f { print }' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then echo "Mibo v$VERSION" > /tmp/notes.md; fi
          gh release create "v$VERSION" app-release.apk \
            --title "Mibo v$VERSION" \
            --notes-file /tmp/notes.md \
          || { gh release upload "v$VERSION" app-release.apk --clobber \
            && gh release edit "v$VERSION" --notes-file /tmp/notes.md; }
